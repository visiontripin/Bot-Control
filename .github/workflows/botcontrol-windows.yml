name: BotControl Windows

on:
  push:
    branches: ["arena/**", "main"]
    paths:
      - "tg-bot-control/desktop-web/**"
      - "tg-bot-control/tools/shared-telegram-mock/**"
      - "tg-bot-control/tools/check-no-tokens.py"
      - ".github/workflows/botcontrol-windows.yml"
  pull_request:
    paths:
      - "tg-bot-control/desktop-web/**"
      - "tg-bot-control/tools/shared-telegram-mock/**"
      - "tg-bot-control/tools/check-no-tokens.py"
      - ".github/workflows/botcontrol-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No live tokens in the tree
        run: python tg-bot-control/tools/check-no-tokens.py
      - name: Test runtime
        working-directory: tg-bot-control/desktop-web
        run: |
          python -m unittest -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test-generated.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build executable
        working-directory: tg-bot-control/desktop-web
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.11.1
          python -m PyInstaller --noconfirm --clean --onefile --name BotControl --add-data "index.html;." --add-data "style.css;." --add-data "app.js;." --add-data "generated.js;." server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test executable
        working-directory: tg-bot-control/desktop-web
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path dist/BotControl.exe) -ArgumentList '--no-browser', '--port', '18765' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              if ($process.HasExited) { throw 'BotControl.exe exited unexpectedly' }
              try {
                $page = Invoke-WebRequest -Uri 'http://127.0.0.1:18765/' -UseBasicParsing -TimeoutSec 2
                $js = Invoke-WebRequest -Uri 'http://127.0.0.1:18765/app.js' -UseBasicParsing -TimeoutSec 2
                $generated = Invoke-WebRequest -Uri 'http://127.0.0.1:18765/generated.js' -UseBasicParsing -TimeoutSec 2
                $status = Invoke-RestMethod -Uri 'http://127.0.0.1:18765/api/status' -TimeoutSec 2
                if ($page.Content -match 'BotControl' -and $js.Content -match 'runtimeStatus' -and $generated.Content -match 'GENERATED_PROMPT' -and $status.state -eq 'stopped') { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw 'BotControl.exe did not serve its assets and status' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: BotControl-Windows
          path: tg-bot-control/desktop-web/dist/BotControl.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish Windows preview
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[win]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'botcontrol-windows-preview-0.7.0'
          $exe = 'tg-bot-control/desktop-web/dist/BotControl.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $notes = @(
            'Локальная версия BotControl Desktop 0.7.0 для Windows (Stage 5 parity). Python не требуется: распакуйте архив и откройте BotControl.exe, затем используйте браузер на http://127.0.0.1:8765/. Консольное окно должно оставаться открытым: пока окно работает, бот может отвечать.',
            '',
            'Новое в 0.7.0: сохранение нескольких ботов на диске (.bc с автобэкапом последних 10 версий), мультибот, полный импорт и экспорт Android .py (правила, команды, наборы, inline-меню, клавиатура), триггеры regex, HTML/MarkdownV2 с безопасным fallback, sendDice и медиа (file_id/URL), callback_query с вложенными подменю, FSM-анкеты, тёмная тема и экспорт диагностики без токенов.',
            '',
            'Локальный ИИ (LiteRT/MediaPipe) по-прежнему работает только в Android-версии. Файл не подписан — Windows может предупредить при первом запуске.',
            '',
            "SHA-256: $hash"
          ) -join "`n"
          $notes | Set-Content -Encoding utf8 windows-release-notes.txt
          # Тег — коммит с BotControl.exe внутри: файл скачивается
          # git fetch <тег> + git show (как APK в botcontrol-apk.yml).
          Copy-Item $exe 'tg-bot-control/desktop-web/BotControl.exe' -Force
          git add -f tg-bot-control/desktop-web/BotControl.exe
          git -c user.name="botcontrol-ci" -c user.email="botcontrol-ci@users.noreply.github.com" commit --no-verify -m "BotControl.exe 0.7.0 (preview) — из $($env:GITHUB_SHA.Substring(0,7))"
          git tag -f $tag
          git push --force origin "refs/tags/$tag"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
            gh release edit $tag --notes-file windows-release-notes.txt --prerelease
          } else {
            gh release create $tag $exe --prerelease --title 'BotControl для Windows — 0.7.0 (Stage 5)' --notes-file windows-release-notes.txt
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
